<main style="max-width:520px">
  <h1>Sign in</h1>
  <div class="card">
    <form id="loginForm">
      <div class="field"><label for="username">Username or email</label><input id="username" autocomplete="username" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn" type="submit" id="btn">Sign in</button>
    </form>
    <div id="err"></div>
    <p class="meta">No account yet? <a href="register.html">Create one</a>.</p>
  </div>
</main>
<footer>Agri-Climate SLM</footer>

<script src="bg-farm.js"></script>
<script src="app.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("err"); err.innerHTML = "";
  try {
    const data = await api("/api/login", { body: JSON.stringify({
      username: document.getElementById("username").value,
      password: document.getElementById("password").value,
    })});
    setSession(data.token, data.username);
    const next = new URLSearchParams(window.location.search).get("next") || "advisor.html";
    window.location.href = next;
  } catch (ex) { err.innerHTML = `<div class="error">${esc(ex.message)}</div>`; }
});
</script>
